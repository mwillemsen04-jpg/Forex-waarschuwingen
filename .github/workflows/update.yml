name: Nieuws bijwerken
on:
  schedule:
    - cron: "23 * * * *"    # elk uur, op 23 minuten over het hele uur
  workflow_dispatch:         # handmatig starten via het tabblad Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ff.json rates.json fx.json sent.json
          git diff --cached --quiet || git commit -m "Nieuws bijgewerkt"
          git push
